# Portable mpv for GTX 1050 Ti / 2560x1440. Default: no neural shaders.
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
scale=ewa_lanczossharp
cscale=spline36
dscale=mitchell
deband=no
# GPU-only ambient fill; controlled from F8. Black bars remain the default.
border-background=color
background-blur-radius=32
interpolation=no
target-colorspace-hint=auto
gpu-shader-cache=yes
gpu-shader-cache-dir=~~/cache/shaders
icc-cache-dir=~~/cache/icc

osc=no
osd-bar=no
border=no
idle=yes
force-window=yes
keep-open=yes
autofit=85%x85%
window-minimized=no
volume=80
volume-max=100
save-position-on-quit=yes
input-doubleclick-time=300
watch-later-dir=~~/watch_later
# Image settings belong to our presets, not temporary A/B or ambient canvas.
watch-later-options-remove=video-aspect-override
watch-later-options-remove=brightness
watch-later-options-remove=contrast
watch-later-options-remove=gamma
watch-later-options-remove=saturation
screenshot-dir=~~/screenshots
screenshot-format=png
slang=ru,rus,en,eng
alang=ru,rus,en,eng
sub-auto=fuzzy
audio-file-auto=fuzzy
sub-font=Segoe UI
osd-font=Segoe UI

cache=yes
cache-on-disk=no
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=64MiB
cache-secs=30
network-timeout=30
ytdl-format=bestvideo[height<=1440]+bestaudio/best[height<=1440]/best
# The portable-runtime script resolves the Deno path after this folder is moved.

[quality-native]
glsl-shaders=""

[quality-ravu]
glsl-shaders="~~/shaders/ravu-lite-ar-r3.hook"

[quality-fsrcnnx8]
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/KrigBilateral.glsl"

[quality-fsrcnnx16]
glsl-shaders="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl;~~/shaders/KrigBilateral.glsl"

[quality-anime]
glsl-shaders="~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K/Anime4K_Restore_CNN_Soft_S.glsl;~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_S.glsl;~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x2.glsl"
