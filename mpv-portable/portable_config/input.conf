# YouTube-style playback controls. uosc consumes clicks over its own buttons.
MBTN_LEFT script-binding player_tools/click
MBTN_LEFT_DBL script-binding player_tools/double-click
MBTN_RIGHT script-binding uosc/menu
MENU script-binding uosc/menu
SPACE cycle pause
k cycle pause
j seek -10
l seek 10
LEFT seek -5
RIGHT seek 5
UP add volume 5
DOWN add volume -5
m cycle mute
f cycle fullscreen
ESC set fullscreen no
t script-binding player_tools/theater
i script-binding player_tools/pip
c cycle sub-visibility
Shift+c script-binding uosc/subtitles
> add speed 0.25
< add speed -0.25
. frame-step
, frame-back-step
0 seek 0 absolute-percent
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent
HOME seek 0 absolute
END seek 100 absolute-percent
Shift+n playlist-next
Shift+p playlist-prev
WHEEL_UP add volume 5
WHEEL_DOWN add volume -5
q quit-watch-later
Ctrl+o script-binding uosc/open-file #! Открыть файл
Ctrl+v script-binding uosc/paste #! Открыть ссылку из буфера
p script-binding uosc/items #! Плейлист
a script-binding uosc/audio #! Звуковые дорожки
s script-binding uosc/subtitles #! Выбор субтитров
Ctrl+g script-binding uosc/chapters #! Главы
h script-binding memo-history #! История просмотра
F2 script-binding quality/menu #! Апскейл и шейдеры — профили
F5 script-binding player_tools/settings #! Настройки плеера
F6 script-binding motion/menu #! Плавность / LSFG
F7 script-binding picture_controls/manual #! Ручные настройки изображения
F8 script-binding picture_controls/ambient #! Подсветка полос
F9 script-binding picture_presets/compare #! До / после
F10 script-binding sleep_timer/menu #! Таймер сна
F11 script-binding picture_presets/menu #! Мои пресеты изображения
F12 script-binding ui_theme/menu #! Оформление > Glass / Deck / Neon / Стандартный
Ctrl+0 script-message-to quality select native #! Качество > Обычный — без шейдеров
Ctrl+1 script-message-to quality select ravu #! Качество > RAVU — лёгкий апскейл
Ctrl+2 script-message-to quality select fsrcnnx8 #! Качество > FSRCNNX 8 + KrigBilateral
Ctrl+3 script-message-to quality select fsrcnnx16 #! Качество > FSRCNNX 16 — тяжёлый
Ctrl+4 script-message-to quality select anime #! Качество > Anime4K — лёгкий
Ctrl+5 script-message-to quality sharpen #! Качество > Дополнительная резкость
F3 script-binding torrserver/menu #! TorrServer > Торренты и файлы
Ctrl+t script-binding torrserver/add #! TorrServer > Добавить magnet или ссылку
Alt+t script-binding torrserver/browser #! TorrServer > Веб-интерфейс
F4 script-binding quality_menu/video_formats_toggle #! Качество потока > Видео
Ctrl+F4 script-binding quality_menu/audio_formats_toggle #! Качество потока > Аудио
n script-binding player_tools/night #! Звук > Ночной режим
b script-binding player_tools/bookmark-add #! Закладки > Добавить момент
B script-binding player_tools/bookmarks #! Закладки > Список закладок
Ctrl+r script-binding player_tools/reload #! Восстановить поток
Ctrl+i script-binding stats/display-stats #! Статистика
Ctrl+I script-binding stats/display-stats-toggle
F1 script-message-to quality help #! Горячие клавиши
Ctrl+, script-binding uosc/open-config-directory #! Настройки > Папка конфигурации
Ctrl+q quit-watch-later #! Выход
