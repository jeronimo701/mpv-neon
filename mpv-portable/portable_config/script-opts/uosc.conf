# Full upstream option reference: docs/uosc-options.conf
languages=ru,en
autoload=no
timeline_style=line
timeline_line_width=3
timeline_size=32
timeline_persistency=paused
timeline_cache=yes
timeline_heatmap=no
progress=windowed
controls=play-pause,next,gap,volume-slider,gap,space,command:cloud:script-binding torrserver/menu?TorrServer,command:bookmark:script-binding player_tools/bookmarks?Закладки,button:night,<video,audio>subtitles,command:high_quality:script-binding quality/menu?Апскейл и шейдеры (F2),command:settings:script-binding player_tools/settings?Настройки,command:picture_in_picture_alt:script-binding player_tools/pip?Мини-плеер,command:crop_16_9:script-binding player_tools/theater?Кинотеатр,fullscreen
controls_size=36
controls_persistency=paused,idle
volume=none
volume_step=5
top_bar=always
top_bar_title=${media-title}
window_border_size=0
border_radius=6
